version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: arc-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=arc_verified_escrow
    ports:
      - '5432:5432'
    volumes:
      - arc_db_data:/var/lib/postgresql/data

volumes:
  arc_db_data:
